{% extends "base.html" %}
{% block title %}Money — 투자 히스토리{% endblock %}
{% block content %}

<!-- ── 로딩 오버레이 ── -->
<div id="priceLoadingOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:20px;">
  <div style="width:48px;height:48px;border:4px solid rgba(255,255,255,0.15);border-top-color:#667eea;border-radius:50%;animation:hSpin 0.8s linear infinite;"></div>
  <div style="color:#fff;font-size:16px;font-weight:700;">현재가 업데이트 중...</div>
</div>

<style>
@keyframes hSpin { to { transform: rotate(360deg); } }

:root {
  --ms-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --glass-border: var(--border);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.11);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.18);
  --r-xl: 16px;
  --r-2xl: 20px;
  --green: #10b981;
  --amber: #f59e0b;
  --blue: #667eea;
  --red: #ef4444;
}

/* ── Header ── */
.hs-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 28px 0 20px; gap: 12px;
}
.hs-header-left h1 {
  font-size: 22px; font-weight: 800; letter-spacing: -0.4px;
  background: var(--ms-gradient);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 2px;
}
.hs-header-left p { font-size: 12px; color: var(--text2); }
.hs-header-badge {
  padding: 6px 14px; border-radius: 99px;
  background: rgba(102,126,234,0.08); border: 1px solid rgba(102,126,234,0.2);
  color: var(--blue); font-size: 12px; font-weight: 700;
  white-space: nowrap;
}

/* ── Summary Cards ── */
.hs-summary {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 12px; margin-bottom: 20px;
}
@media (max-width: 440px) { .hs-summary { grid-template-columns: 1fr; } }

.hs-sum-card {
  background: var(--bg); border: 1px solid var(--glass-border);
  border-radius: var(--r-xl); padding: 18px 20px;
  position: relative; overflow: hidden;
  transition: box-shadow 0.2s var(--ease-out);
}
.hs-sum-card:hover { box-shadow: var(--shadow-md); }
.hs-sum-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: 3px 0 0 3px;
}
.hs-sum-card.blue::before   { background: var(--blue); }
.hs-sum-card.green::before  { background: var(--green); }

.hs-sum-label {
  font-size: 10px; font-weight: 700; color: var(--text2);
  text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 8px;
}
.hs-sum-value {
  font-size: 20px; font-weight: 800; letter-spacing: -0.4px;
  font-variant-numeric: tabular-nums; line-height: 1.2;
}
.hs-sum-sub {
  font-size: 10px; color: var(--text2); margin-top: 3px;
}

/* ── Chart Cards ── */
.hs-chart-card {
  background: var(--bg); border: 1px solid var(--glass-border);
  border-radius: var(--r-xl); padding: 22px 24px;
  margin-bottom: 16px;
  transition: box-shadow 0.2s var(--ease-out);
}
.hs-chart-card:hover { box-shadow: var(--shadow-sm); }

.hs-chart-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 16px; flex-wrap: wrap; gap: 8px;
}
.hs-chart-title {
  font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 2px;
}
.hs-chart-subtitle { font-size: 11px; color: var(--text2); }
.hs-chart-current {
  font-size: 18px; font-weight: 800;
  letter-spacing: -0.4px; font-variant-numeric: tabular-nums;
  text-align: right;
}
.hs-chart-current-sub { font-size: 10px; color: var(--text2); text-align: right; margin-top: 1px; }

.hs-chart-wrap { position: relative; width: 100%; }


/* ── Empty State ── */
.hs-empty {
  text-align: center; padding: 64px 24px;
  background: var(--bg); border: 1px solid var(--glass-border);
  border-radius: var(--r-xl); margin-bottom: 16px;
  color: var(--text2);
}
.hs-empty .icon { font-size: 48px; margin-bottom: 14px; opacity: 0.25; display: block; }
.hs-empty .title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.hs-empty .msg { font-size: 13px; }

</style>


<!-- ══════════════════════════════════════
     HEADER
══════════════════════════════════════ -->
<div class="hs-header">
  <div class="hs-header-left">
    <h1>투자 히스토리</h1>
    <p>홈 화면 접속 시 매일 자동 저장</p>
  </div>
  <span class="hs-header-badge" id="dataBadge" style="display:none;"></span>
</div>


<!-- ══════════════════════════════════════
     SUMMARY
══════════════════════════════════════ -->
<div class="hs-summary" id="summaryRow" style="display:none;">
  <div class="hs-sum-card blue">
    <div class="hs-sum-label">포트폴리오 평가액</div>
    <div class="hs-sum-value" id="sum-total">—</div>
    <div class="hs-sum-sub"   id="sum-total-chg">최신 스냅샷</div>
  </div>
  <div class="hs-sum-card green">
    <div class="hs-sum-label">평가이익</div>
    <div class="hs-sum-value" id="sum-gain">—</div>
    <div class="hs-sum-sub"   id="sum-gain-chg">미실현 손익</div>
  </div>
</div>


<!-- ══════════════════════════════════════
     EMPTY STATE
══════════════════════════════════════ -->
<div id="noDataMsg" style="display:none;">
  <div class="hs-empty">
    <span class="icon">📭</span>
    <div class="title">아직 데이터가 없습니다</div>
    <div class="msg">홈 화면을 방문하면 오늘부터 데이터가 쌓이기 시작합니다</div>
  </div>
</div>


<!-- ══════════════════════════════════════
     CHARTS
══════════════════════════════════════ -->
<div id="chartsWrap" style="display:none;">

  <!-- 포트폴리오 평가액 (full width) -->
  <div class="hs-chart-card">
    <div class="hs-chart-header">
      <div class="hs-chart-header-left">
        <div class="hs-chart-title">포트폴리오 평가액 추이</div>
        <div class="hs-chart-subtitle">원화 환산 총 평가액</div>
      </div>
      <div>
        <div class="hs-chart-current" style="color:var(--blue);" id="val-total"></div>
        <div class="hs-chart-current-sub" id="val-total-chg"></div>
      </div>
    </div>
    <div class="hs-chart-wrap">
      <canvas id="chart-total" height="80"></canvas>
    </div>
  </div>

  <!-- 평가이익 (full width) -->
  <div class="hs-chart-card">
    <div class="hs-chart-header">
      <div>
        <div class="hs-chart-title">평가이익 추이</div>
        <div class="hs-chart-subtitle">미실현 손익 (USD)</div>
      </div>
      <div>
        <div class="hs-chart-current" id="val-gain2">—</div>
        <div class="hs-chart-current-sub">현재 미실현</div>
      </div>
    </div>
    <div class="hs-chart-wrap">
      <canvas id="chart-gain" height="80"></canvas>
    </div>
  </div>

</div><!-- /chartsWrap -->


<!-- ══════════════════════════════════════
     SCRIPT
══════════════════════════════════════ -->
<script>
function fmtW(w) {
  const sign = w < 0 ? '-' : '', a = Math.abs(w);
  if (a >= 1e12) return sign + (a/1e12).toFixed(2) + '조원';
  if (a >= 1e8)  return sign + (a/1e8 ).toFixed(2) + '억원';
  if (a >= 1e4)  return sign + Math.round(a/1e4).toLocaleString() + '만원';
  return sign + Math.round(a).toLocaleString() + '원';
}
function fmtUSD(v) {
  const sign = v < 0 ? '-' : '', a = Math.abs(v);
  if (a >= 1e9) return sign + '$' + (a/1e9).toFixed(2) + 'B';
  if (a >= 1e6) return sign + '$' + (a/1e6).toFixed(2) + 'M';
  if (a >= 1e3) return sign + '$' + (a/1e3).toFixed(2) + 'K';
  return sign + '$' + a.toFixed(2);
}
function gainColor(v) { return v >= 0 ? '#10b981' : '#ef4444'; }
function setText(id, v) { const el = document.getElementById(id); if (el) el.textContent = v; }
function setColor(id, c) { const el = document.getElementById(id); if (el) el.style.color = c; }

function baseOptions() {
  const tickColor = getComputedStyle(document.documentElement).getPropertyValue('--text2').trim() || '#a8b3c0';
  return {
    responsive: true,
    maintainAspectRatio: true,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: 'rgba(15,20,35,0.95)',
        titleColor: '#fff', bodyColor: '#ccc',
        borderColor: 'rgba(255,255,255,0.08)', borderWidth: 1,
        cornerRadius: 10, padding: 12,
        callbacks: { label: ctx => ' ' + fmtW(ctx.parsed.y) },
      },
    },
    scales: {
      x: {
        grid: { display: false },
        border: { display: false },
        ticks: {
          font: { size: 10 }, color: tickColor, maxTicksLimit: 12,
          callback: function(val) {
            const lbl = this.getLabelForValue(val);
            return lbl ? lbl.slice(2) : '';
          }
        }
      },
      y: {
        grid: { color: 'rgba(128,128,128,0.08)', drawBorder: false },
        border: { display: false },
        ticks: { font: { size: 10 }, color: tickColor, callback: v => fmtW(v) }
      }
    }
  };
}

function makeDataset(data, color, fill = true) {
  return {
    data,
    borderColor: color,
    backgroundColor: fill ? color + '18' : 'transparent',
    borderWidth: 2,
    pointRadius: data.length <= 15 ? 3 : 0,
    pointHoverRadius: 5,
    fill,
    tension: 0.35,
  };
}

function pctChange(first, last) {
  if (!first || first === 0) return null;
  return (last - first) / Math.abs(first) * 100;
}

const NEEDS_REFRESH = {{ needs_refresh | safe }};

function loadHistory() {
  fetch('/api/history')
  .then(r => r.json())
  .then(resp => {
    const data = resp.items ?? resp;

    if (!data || data.length === 0) {
      document.getElementById('noDataMsg').style.display = '';
      return;
    }

    document.getElementById('chartsWrap').style.display = '';
    document.getElementById('summaryRow').style.display = '';

    // 배지
    const badge = document.getElementById('dataBadge');
    badge.textContent = data.length + '개월 기록';
    badge.style.display = '';

    // 헤더 노트
    const noteEl = document.querySelector('.hs-header-left p');
    if (noteEl) noteEl.textContent = data.length + '개월 데이터 기록됨 · 홈 접속 시 자동 저장';

    const months = data.map(d => d.month);
    const total  = data.map(d => d.totalValueKrw);
    const gain   = data.map(d => d.unrealizedGainUsd);
    const first   = data[0];
    const last    = data[data.length - 1];

    // Summary cards
    setText('sum-total', fmtW(last.totalValueKrw));
    const totalChg = pctChange(first.totalValueKrw, last.totalValueKrw);
    if (totalChg !== null && data.length > 1) {
      const el = document.getElementById('sum-total-chg');
      el.textContent = (totalChg >= 0 ? '+' : '') + totalChg.toFixed(1) + '% vs 최초';
      el.style.color = gainColor(totalChg);
    }

    const gainVal = document.getElementById('sum-gain');
    gainVal.textContent = fmtUSD(last.unrealizedGainUsd);
    gainVal.style.color = gainColor(last.unrealizedGainUsd);
    const gainChg = pctChange(first.unrealizedGainUsd, last.unrealizedGainUsd);
    if (gainChg !== null && data.length > 1) {
      const el = document.getElementById('sum-gain-chg');
      el.textContent = (gainChg >= 0 ? '+' : '') + gainChg.toFixed(1) + '% vs 최초';
      el.style.color = gainColor(gainChg);
    }

    // Chart header values
    setText('val-total', fmtW(last.totalValueKrw));
    if (totalChg !== null && data.length > 1) {
      const el = document.getElementById('val-total-chg');
      el.textContent = (totalChg >= 0 ? '+' : '') + totalChg.toFixed(1) + '% (전체 기간)';
      el.style.color = gainColor(totalChg);
    }

    const g2El = document.getElementById('val-gain2');
    g2El.textContent = fmtUSD(last.unrealizedGainUsd);
    g2El.style.color = gainColor(last.unrealizedGainUsd);

    const ctx = id => document.getElementById(id).getContext('2d');

    /* Chart 1: 평가액 */
    new Chart(ctx('chart-total'), {
      type: 'line',
      data: { labels: months, datasets: [makeDataset(total, '#667eea')] },
      options: baseOptions(),
    });

    /* Chart 2: 평가이익 */
    const gainOpts = baseOptions();
    gainOpts.plugins.tooltip.callbacks.label = c => ' ' + fmtUSD(c.parsed.y);
    gainOpts.scales.y.ticks.callback = v => fmtUSD(v);
    new Chart(ctx('chart-gain'), {
      type: 'line',
      data: { labels: months, datasets: [{
        ...makeDataset(gain, '#10b981'),
        segment: { borderColor: c => gainColor(c.p1.parsed.y) }
      }]},
      options: gainOpts,
    });

  })
  .catch(() => {
    document.getElementById('noDataMsg').style.display = '';
  });
}

if (NEEDS_REFRESH) {
  const overlay = document.getElementById('priceLoadingOverlay');
  overlay.style.display = 'flex';
  fetch('/api/refresh-prices')
    .then(() => { overlay.style.display = 'none'; loadHistory(); })
    .catch(() => { overlay.style.display = 'none'; loadHistory(); });
} else {
  loadHistory();
}
</script>

{% endblock %}
